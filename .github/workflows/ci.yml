name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run test suite
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pytest

  eval-gate:
    runs-on: ubuntu-latest
    needs: test
    # Requires an OPENAI_API_KEY repo/organization secret — the eval run
    # does real embedding, generation, and LLM-judge calls (docs/10
    # §3.6 "Evaluation framework"). Without the secret this job fails
    # fast rather than silently skipping the regression gate.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run evaluation against golden queries and gate on regression
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        # --no-mlflow: the runner is ephemeral and has no access to a
        # persistent tracking store (local sqlite would vanish with the
        # runner; the Dockerized server in docker/docker-compose.yml isn't
        # brought up here). Local/dev runs of this same command still log
        # to the finance_compliance_rag_eval experiment by default.
        run: |
          python -m src.evaluation.run_eval --no-mlflow --tolerance 0.05

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: data/eval_results/*.json
